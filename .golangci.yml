version: "2"

run:
  build-tags:
    - webkit2_41
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - cyclop
    - dupl
    - errname
    - errorlint
    - exhaustive
    - funlen
    - gocognit
    - goconst
    - gocritic
    - gosec
    - intrange
    - lll
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - revive
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - wrapcheck
  settings:
    cyclop:
      max-complexity: 10
    funlen:
      lines: 60
      statements: 40
      ignore-comments: true
    gocognit:
      min-complexity: 15
    lll:
      line-length: 120
    nestif:
      min-complexity: 4
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: receiver-naming
        - name: error-strings
        - name: error-naming
        - name: error-return
        - name: context-as-argument
        - name: unused-parameter
        - name: early-return
        - name: indent-error-flow
        - name: superfluous-else
        - name: file-length-limit
          arguments:
            - max: 300
              skipComments: true
              skipBlankLines: true
    wrapcheck:
      ignore-package-globs:
        - verbloom/*
  exclusions:
    generated: strict
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - dupl
          - funlen
          - goconst
          - gosec
          - wrapcheck
    paths:
      - frontend
      - build

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: verbloom
      extra:
        group-params: true
        clothe-returns: true
    goimports:
      local-prefixes:
        - verbloom
  exclusions:
    paths:
      - frontend
      - build

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
